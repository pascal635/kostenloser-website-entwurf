<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nicht verfügbar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#22305C; --ink-soft:#5A6178; --cream:#FBF7F1; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Hanken Grotesk',system-ui,sans-serif; background:var(--cream); color:var(--navy);
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .box { max-width:440px; }
  h1 { font-size:1.4rem; margin-bottom:10px; }
  p { color:var(--ink-soft); font-size:0.98rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>Diese Seite ist derzeit nicht verfügbar.</h1>
    <p>Dieser Entwurf wurde offline genommen.</p>
  </div>
</body>
</html>
