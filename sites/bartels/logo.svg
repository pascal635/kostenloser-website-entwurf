<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 158" width="600" height="158" role="img" aria-label="Fliesenlegerhandwerk Hannover, Sandro Bartels">
  <title>Fliesenlegerhandwerk Hannover</title>
  <!-- Rekonstruktion der Wortmarke von Visitenkarte und Firmenshirt.
       Farben gemessen und weissabgeglichen: Balken 1 #8A8A8A, Balken 2 #111111, Papier #FFFFFF. -->
  <g font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="600">
    <rect x="0" y="0" width="600" height="68" fill="#8A8A8A"/>
    <text x="22" y="49" font-size="43" letter-spacing="0.3" fill="#111111">Fliesenlegerhandwerk</text>
    <rect x="0" y="90" width="600" height="68" fill="#111111"/>
    <text x="22" y="139" font-size="43" letter-spacing="0.3" fill="#F7F6F4">Hannover</text>
  </g>
</svg>
